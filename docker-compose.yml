volumes:
  data:
    driver: local
  filestore:
    driver: local
services:
  db:
    container_name: db
    image: postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: "<ANY PASSOWORD>"
      POSTGRES_USER: root
      PSQL_USERNAME: root
      # POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /data/postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d carbondev"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
      target: migration
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "<ANY PASSOWORD>"
      DB_NAME: carbondev
      TYPEORM_SYNCHRONIZE: "false"
    command: ["yarn", "migration:run"]
  national:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "<ANY PASSOWORD>"
      TYPEORM_SYNCHRONIZE: "false"
      RUN_MODULE: national-api
      rootEmail: "admin@champa.la"
      cfAdminEmail: "climatefund@champa.la"
      exComAdminEmail: "excom@champa.la"
      Ministry: ""
      Department: ""
      systemCountryCode: "LA"
      systemCountryName: "Lao PDR"
      systemContinentName: "Asia"
      countryClimateFundName: "Lao PDR Climate Fund"
      name: "Ministry of Agriculture and Environment"
      climateFundName: "Lao PDR Climate Fund"
      exComName: "Executive Committee"
      # TODO: replace with base64-encoded MAE/Champa logo before production use
      logoBase64: "sss"
      IS_EMAIL_DISABLED: "true"
      DISABLE_LOW_PRIORITY_EMAIL: "true"
      EMAILPREFIX: ""
      LOCATION_SERVICE: FILE
      ASYNC_OPERATIONS_TYPE: Database
      HOST: "http://localhost:3030"
      DOMAIN_MAP: "true"
      EXPIRES_IN: "7200"
      REFRESH_TOKEN_EXPIRES_IN: "12h"
      BACKEND_HOST: "http://192.168.1.16:3000"
      CONTACT_EMAIL: countryx@email.com
      MINISTER_NAME_AND_DESIGNATION: "\nHonorable Minister X\nMinister\nMinistry of Environment, Forestry & Tourism"
      CACHE_PROJECT_TTL: 60000
      CACHE_PROJECT_MAX: 100
      CACHE_RETIREMENT_TTL: 60000
      CACHE_RETIREMENT_MAX: 100
      CACHE_ORGANISATION_TTL: 60000
      CACHE_ORGANISATION_MAX: 100
      RATE_LIMIT_PROJECT_LIMIT: 100
      RATE_LIMIT_PROJECT_DURATION: 60
      RATE_LIMIT_RETIREMENT_LIMIT: 100
      RATE_LIMIT_RETIREMENT_DURATION: 60
      RATE_LIMIT_ORGANISATION_LIMIT: 100
      RATE_LIMIT_ORGANISATION_DURATION: 60
    volumes:
      - filestore:/app/backend/services/public
      - ./backend/services/users.csv:/app/backend/services/users.csv
      - ./backend/services/organisations.csv:/app/backend/services/organisations.csv
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/national/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  stats:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
      national:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "<ANY PASSOWORD>"
      TYPEORM_SYNCHRONIZE: "false"
      RUN_PORT: 3100
      RUN_MODULE: analytics-api
      DOMAIN_MAP: "true"
  replicator:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      national:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "<ANY PASSOWORD>"
      TYPEORM_SYNCHRONIZE: "false"
      # ,data-importer
      RUN_MODULE: replicator,async-operations-handler
      LOCATION_SERVICE: OPENSTREET
      SMTP_ENDPOINT: email-smtp.us-east-1.amazonaws.com
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      IS_EMAIL_DISABLED: "true"
      DISABLE_LOW_PRIORITY_EMAIL: "true"
      EMAILPREFIX: ""
      ASYNC_OPERATIONS_TYPE: Database
      ITMO_API_KEY: ""
      ITMO_EMAIL: ""
      ITMO_PASSWORD: ""
      MRV_ENDPOINT: "http://192.168.123.20:9000"
      SYNC_ENABLE: false
      MRV_API_TOKEN: ""
      BACKEND_HOST: "http://192.168.1.16:3000"
    volumes:
      - filestore:/app/backend/services/public
  # async-operations-handler:
  #   build:
  #     context: .
  #     dockerfile: ./backend/services/Dockerfile
  #   depends_on:
  #     - db
  #     - national
  #   environment:
  #     DB_HOST: db
  #     DB_USER: root
  #     DB_PASSWORD: "<ANY PASSOWORD>"
  #     RUN_MODULE: async-operations-handler
  #     SMTP_ENDPOINT: email-smtp.us-east-1.amazonaws.com
  #     SMTP_PASSWORD: "<ANY PASSOWORD>"
  #     ASYNC_OPERATIONS_TYPE: Database
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
      args:
        PORT: 3030
        VITE_APP_BACKEND: http://localhost:3000
        VITE_APP_STAT_URL: http://localhost:3100
        VITE_APP_COUNTRY_NAME: "Lao PDR"
        VITE_APP_REGISTRY_NAME: "Champa Registry Demonstration"
        VITE_APP_COUNTRY_FLAG_URL: "https://upload.wikimedia.org/wikipedia/commons/5/56/Flag_of_Laos.svg"
        VITE_APP_COUNTRY_CODE: "LA"
        VITE_APP_MAP_TYPE: "MapLibre"
    environment:
      VITE_APP_BACKEND: http://localhost:3000
      VITE_APP_COUNTRY_NAME: "Lao PDR"
      VITE_APP_REGISTRY_NAME: "Champa Registry Demonstration"
      VITE_APP_MAXIMUM_FILE_SIZE: "5242880"
    ports:
      - "3030:3030"
    depends_on:
      db:
        condition: service_healthy
      national:
        condition: service_healthy
